<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeInsight AI</title>
    <style>
      html.dark, html.dark body { background-color: #08090a; }
    </style>
    <script>
      // Avoid a flash of light background before React mounts.
      try {
        var t = localStorage.getItem("codeinsight-theme");
        document.documentElement.classList.add(t === "light" ? "light" : "dark");
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
